name: ReelParty Live prototype checks
on:
  push:
    branches:
      - reelparty-live-prototype
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server.js
      - run: node --check app.js
      - run: npm test
